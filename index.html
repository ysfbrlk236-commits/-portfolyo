<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yusuf Barlak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Yusuf Barlak — Mekatronik mühendisliği öğrencisi ve oyun geliştirici. Oyun menüsü tarzında portföy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@1,6..96,900&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen game shell. Menu stairs down the left, the character art stands on the right in front of a halftone sun, a help bar runs along the bottom. Each menu item opens its own staged scene: an arm hands over an ID card, a notebook opens, a project wheel turns around a head, a rotary phone dials. Single look on purpose: ink and paper for type, and a fixed vivid color set per section that the whole screen shifts to. */
:root{
  --ink:#0d0c10;          /* the night */
  --ink-2:#18161d;        /* ray stripes, card shade */
  --ink-3:#25222b;        /* hairlines on ink */
  --paper:#fbfaf6;        /* stark paper white */
  --paper-2:#cfcdc6;      /* muted paper text */
  --page:#fffdf4;         /* notebook paper */
  --skin:#ffd8c0;--skin-2:#f0968c;
  --on-accent:#0d0c10;

  --f-display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-heavy:"Archivo Black","Arial Black","Helvetica Neue",sans-serif;
  --f-serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;

  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --bar:64px;
  color-scheme:light;
}
/* Every menu item owns a vivid color set; the whole screen shifts to it as you move through the menu. */
@property --bg{syntax:"<color>";inherits:true;initial-value:#ff3e8a}
@property --ray{syntax:"<color>";inherits:true;initial-value:#ff6aa6}
@property --pop{syntax:"<color>";inherits:true;initial-value:#ffe14a}
@property --deep{syntax:"<color>";inherits:true;initial-value:#a3124f}
@property --a{syntax:"<angle>";inherits:false;initial-value:180deg}
@property --hx{syntax:"<angle>";inherits:false;initial-value:0deg}
#app{--bg:#ff3e8a;--ray:#ff6aa6;--pop:#ffe14a;--deep:#a3124f;
  --accent:var(--pop);--accent-2:var(--deep);
  background:var(--bg);transition:--bg .5s ease,--ray .5s ease,--pop .5s ease,--deep .5s ease}
#app[data-sec="egitim"]{--bg:#1fb6ff;--ray:#5fcbff;--pop:#ff3e8a;--deep:#0a5c9c}
#app[data-sec="projeler"]{--bg:#ffd21a;--ray:#ffe263;--pop:#9b5cff;--deep:#8a6400}
#app[data-sec="yetenekler"]{--bg:#5fdc34;--ray:#8bea63;--pop:#ff5a1f;--deep:#26700e}
#app[data-sec="iletisim"]{--bg:#9b5cff;--ray:#b386ff;--pop:#b6ff3a;--deep:#4a1aa0}

html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow-x:hidden;overflow-y:auto}
#app{height:100%;position:relative}
button{font:inherit;color:inherit}
a{color:inherit}
kbd{font-family:var(--f-ui);font-weight:700;font-size:.82em;display:inline-block;min-width:1.7em;padding:.05em .4em;text-align:center;background:var(--paper);color:var(--ink);transform:skewX(-8deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── stage ───────── */
.stage{position:relative;height:100%;min-height:540px;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.rays{position:absolute;left:68%;top:46%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(from 0deg,var(--bg) 0deg 4.5deg,var(--ray) 4.5deg 9deg);
  animation:spin 180s linear infinite}
.sun{position:absolute;left:68%;top:46%;width:min(66vh,48vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);
  box-shadow:0 0 0 14px var(--ink),0 0 0 20px var(--paper),0 0 0 26px var(--ink)}
.sun-dots{position:absolute;left:68%;top:46%;width:min(110vh,80vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--deep) 1.7px,transparent 2.2px) 0 0/9px 9px;
  -webkit-mask:radial-gradient(circle,transparent 42%,#000 46%,transparent 70%);mask:radial-gradient(circle,transparent 42%,#000 46%,transparent 70%)}
.shard{position:absolute;pointer-events:none}
.shard.s1{left:-8vw;bottom:calc(var(--bar) - 10px);width:78vw;height:58vh;background:var(--paper);clip-path:polygon(0 88%,100% 54%,100% 62%,0 100%)}
.shard.s2{left:-4vw;bottom:calc(var(--bar) - 30px);width:70vw;height:52vh;background:var(--accent);clip-path:polygon(0 98%,100% 64%,100% 67%,0 100%)}
.shard.s3{right:-6vw;top:-4vh;width:46vw;height:30vh;background:var(--paper);clip-path:polygon(18% 0,100% 0,100% 30%,0 46%)}
.grain{position:absolute;inset:0;background:radial-gradient(circle,rgba(13,12,16,.09) 1px,transparent 1.3px) 0 0/5px 5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* HUD: date */
.hud{position:absolute;top:14px;left:var(--gut-l);z-index:5;display:flex;align-items:flex-end;gap:10px;transform:rotate(-5deg);transform-origin:left top}
.date-dm{font:400 clamp(44px,6vw,78px)/.85 var(--f-display);color:var(--paper);text-shadow:4px 4px 0 var(--ink),6px 6px 0 var(--accent);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.date-side{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-bottom:4px}
.date-dw{font:800 clamp(18px,2vw,26px)/1 var(--f-ui);background:var(--accent);color:var(--on-accent);padding:2px 10px 1px;transform:skewX(-12deg)}
.date-tod{font:700 clamp(12px,1.2vw,15px)/1 var(--f-ui);letter-spacing:.18em;background:var(--paper);color:var(--ink);padding:3px 8px 2px}

/* brand */
.brand{position:absolute;top:clamp(92px,13vh,128px);left:var(--gut-l);z-index:5;max-width:min(640px,62vw)}
.ransom{margin:0;display:flex;flex-wrap:wrap;gap:.08em .5em;font-size:clamp(30px,4.2vw,60px);line-height:1}
.ransom .w{display:flex;gap:.05em}
.ransom .l{display:inline-block;padding:.08em .13em .02em;font-family:var(--f);font-size:var(--s,1em);background:var(--b);color:var(--c);transform:rotate(var(--r)) translateY(var(--y));box-shadow:3px 3px 0 var(--ink)}
.role{margin:14px 0 0;display:inline-block;font:700 clamp(13px,1.35vw,17px)/1.25 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:5px 12px 4px;border-left:6px solid var(--accent);transform:skewX(-10deg)}
.role span{display:inline-block;transform:skewX(10deg)}

/* menu */
.menu{position:absolute;left:var(--gut-l);bottom:calc(var(--bar) + clamp(20px,5vh,56px));z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(0px,.6vh,8px)}
.mi{--i:0;position:relative;display:block;background:none;border:0;cursor:pointer;margin-left:calc(var(--i) * clamp(12px,2.4vw,40px));
  padding:.04em .3em .02em .18em;font:400 clamp(40px,min(6.4vw,8.6vh),94px)/.9 var(--f-display);letter-spacing:.012em;color:var(--paper);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),7px 7px 0 var(--ink);transform:rotate(-4deg) skewX(-9deg);transition:transform .16s ease;
  animation:slidein .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.mi .t{position:relative;z-index:2}
.mi::before{content:"";position:absolute;inset:-.02em -.16em -.04em -.1em;z-index:1;background:var(--ink);clip-path:polygon(2% 16%,100% 0,97% 84%,0 100%);transform:scaleX(0);transform-origin:left center;transition:transform .2s cubic-bezier(.2,.9,.2,1.25)}
.mi::after{content:"";position:absolute;inset:-.2em -.42em -.12em -.04em;z-index:0;background:var(--paper);clip-path:polygon(0 42%,100% 6%,90% 100%,12% 78%);opacity:0;transform:translate(.14em,.08em) rotate(5deg);transition:opacity .1s}
.mi.on{color:var(--pop);text-shadow:none;transform:rotate(-4deg) skewX(-9deg) scale(1.06)}
.mi.on::before{transform:scaleX(1)}
.mi.on::after{opacity:1}
.mi:focus-visible{outline:3px dashed var(--ink);outline-offset:8px}
@keyframes slidein{from{translate:-40px 0}to{translate:0 0}}

/* character art */
.char{position:absolute;right:clamp(0px,4vw,80px);bottom:calc(var(--bar) - 18px);height:calc((100% - var(--bar)) * var(--h,.86));width:56vw;margin:0;z-index:4;pointer-events:none}
.char img{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;filter:drop-shadow(12px 6px 0 var(--deep)) drop-shadow(-5px 0 0 var(--ink));opacity:0;transition:opacity .18s}
.char img.on{opacity:1;animation:artin .42s cubic-bezier(.2,.9,.2,1)}
.char.flash img.on{filter:invert(1) drop-shadow(12px 6px 0 var(--deep))}
@keyframes artin{from{transform:translateX(60px) skewX(-6deg)}to{transform:none}}

/* cat navigator */
.navi{position:absolute;top:12px;right:var(--gut-r);z-index:7;display:flex;align-items:flex-start;flex-direction:row-reverse;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.navi-pic{position:relative;width:clamp(64px,7vw,92px);aspect-ratio:1;flex:none;background:var(--paper);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:grid;place-items:center;transition:transform .2s}
.navi-pic img{width:84%;height:84%;object-fit:cover;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.navi-name{position:absolute;right:0;top:calc(clamp(64px,7vw,92px) - 14px);font:800 13px/1 var(--f-ui);letter-spacing:.12em;background:var(--accent);color:var(--on-accent);padding:3px 7px 2px;transform:skewX(-12deg)}
.bubble{position:relative;margin-top:10px;max-width:min(290px,28vw);background:var(--paper);color:var(--ink);font:600 14px/1.35 var(--f-body);padding:10px 14px 11px;clip-path:polygon(0 4%,95% 0,95% 38%,100% 46%,95% 58%,97% 100%,3% 96%)}
.bubble b{font-family:var(--f-ui);font-weight:800;letter-spacing:.08em;display:block;font-size:11px;color:var(--accent-2);margin-bottom:3px}
.bubble img{display:block;width:120px;margin-top:8px;filter:drop-shadow(4px 4px 0 var(--accent))}
.navi:hover .navi-pic,.navi:focus-visible .navi-pic{transform:rotate(-8deg) scale(1.06)}
.navi:focus-visible{outline:3px dashed var(--paper);outline-offset:4px}
.navi.wiggle .navi-pic{animation:wig .35s}
@keyframes wig{25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}

/* help bar */
.helpbar{position:absolute;left:0;right:0;bottom:0;z-index:8;min-height:var(--bar);display:flex;align-items:center;gap:18px 26px;flex-wrap:wrap;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:16px 10px;background:var(--ink);clip-path:polygon(0 22%,100% 0,100% 100%,0 100%);
  font:600 15px/1.3 var(--f-ui);letter-spacing:.04em}
.hb-desc{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.hb-tag{flex:none;font:800 13px/1 var(--f-ui);letter-spacing:.14em;background:var(--accent);color:var(--on-accent);padding:4px 9px 3px;transform:skewX(-12deg)}
.hb-desc span:last-child{min-width:0;color:var(--paper)}
.hb-keys{display:flex;align-items:center;gap:6px;color:var(--paper-2);white-space:nowrap}
.hb-keys kbd{margin-left:6px}
.hb-opts{display:flex;align-items:center;gap:14px}
.seg{display:flex;gap:2px}
.seg button{background:var(--ink-3);border:0;cursor:pointer;font:800 13px/1 var(--f-ui);letter-spacing:.1em;padding:6px 9px 5px;color:var(--paper-2);transform:skewX(-10deg)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.seg button:focus-visible{outline:2px dashed var(--paper);outline-offset:3px}

/* ───────── panels (shared) ───────── */
.panel{position:fixed;inset:0;z-index:50;overflow-y:auto;overflow-x:hidden;background:var(--bg);overscroll-behavior:contain}
.panel::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(-58deg,var(--bg) 0 22px,var(--ray) 22px 44px);pointer-events:none}
.p-art{position:fixed;right:0;bottom:0;height:90vh;width:44vw;margin:0;pointer-events:none;z-index:1}
.p-art::before{content:"";position:absolute;right:6vw;bottom:14vh;width:min(70vh,36vw);aspect-ratio:1;border-radius:50%;background:var(--accent);box-shadow:0 0 0 12px var(--ink),0 0 0 18px var(--paper)}
.p-art img{position:absolute;right:2vw;bottom:0;height:var(--ph,100%);width:auto;max-width:none;filter:drop-shadow(12px 6px 0 var(--accent-2)) drop-shadow(-5px 0 0 var(--ink));animation:artin .5s cubic-bezier(.2,.9,.2,1)}
.p-wrap{position:relative;z-index:2;max-width:820px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:22px 72px;margin-left:clamp(0px,5vw,96px)}
.p-wrap.wide{max-width:1280px;margin-inline:auto}
.back{display:inline-flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border:0;cursor:pointer;font:800 16px/1 var(--f-ui);letter-spacing:.14em;padding:9px 14px 8px;transform:skewX(-12deg);box-shadow:5px 5px 0 var(--ink)}
.back kbd{background:var(--ink);color:var(--paper);transform:none}
.back:hover{background:var(--accent);color:var(--on-accent)}
.back:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.p-head{position:relative;margin:26px 0 30px}
.p-kicker{font:800 14px/1.3 var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.p-title{position:relative;display:inline-block;margin:20px 0 0;font:400 clamp(58px,12vw,148px)/.84 var(--f-display);letter-spacing:.01em;color:var(--paper);transform:rotate(-4deg) skewX(-7deg);text-shadow:5px 5px 0 var(--pop);text-wrap:balance}
.p-title::before{content:"";position:absolute;z-index:-1;left:-.12em;right:-.22em;top:.3em;bottom:-.08em;background:var(--ink);clip-path:polygon(0 10%,100% 0,97% 100%,3% 86%)}
.wide .p-title{font-size:clamp(52px,8vw,112px)}
.wide .p-head{margin:22px 0 18px}
.p-thumb{display:none}
.p-body{display:flex;flex-direction:column;gap:30px}
.p-foot{margin-top:46px;font:800 13px/1.4 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}

.h3{margin:0 0 14px;display:flex;align-items:center;gap:12px;font:800 clamp(20px,2.4vw,26px)/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.h3::before{content:"";width:22px;height:22px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%,22% 50%);flex:none}

.cardw{filter:drop-shadow(8px 8px 0 var(--ink))}
.card{background:var(--paper);color:var(--ink);padding:22px 24px 22px;clip-path:polygon(0 0,100% 1.5%,99% 100%,.8% 98%)}
.card p{margin:0;font:500 17px/1.6 var(--f-body);max-width:62ch}
.card p + p{margin-top:12px}
.pill{display:inline-block;font:800 12px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;padding:5px 9px 4px;background:var(--ink);color:var(--paper);transform:skewX(-10deg);vertical-align:middle}
.pill.live{background:var(--accent);color:var(--on-accent);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{background:var(--ink);color:var(--paper)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 14px/1 var(--f-ui);letter-spacing:.06em;padding:7px 11px 6px;border:2px solid var(--ink);transform:skewX(-8deg)}
.lnk{display:inline-flex;align-items:center;gap:6px;font:800 14px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;background:var(--ink);color:var(--paper);padding:9px 12px 8px;transform:skewX(-10deg);white-space:nowrap}
.lnk:hover{background:var(--pop);color:var(--ink)}
.lnk:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

.split{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:start}
.polaroid{margin:6px 0 0;background:var(--paper);color:var(--ink);padding:10px 10px 14px;transform:rotate(4deg);box-shadow:8px 8px 0 var(--ink)}
.polaroid img{display:block;width:100%;background:var(--ink)}
.polaroid figcaption{font:600 22px/1.1 var(--f-hand);margin-top:8px;text-align:center}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:baseline;font:600 16px/1.45 var(--f-body);color:var(--ink)}
.log time{justify-self:start;font:800 14px/1 var(--f-ui);letter-spacing:.1em;color:var(--pop);background:var(--ink);padding:5px 8px 4px;transform:skewX(-10deg);font-variant-numeric:tabular-nums}

/* panel reveals (each scene enters its own way) */
.panel.rv{background:transparent}
.panel.rv::before{animation:var(--rv) .6s cubic-bezier(.7,0,.25,1) both}
@keyframes rvSide{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes rvSlash{from{clip-path:polygon(0 100%,0 100%,0 100%,0 100%)}55%{clip-path:polygon(0 30%,70% 0,30% 100%,0 100%)}to{clip-path:polygon(0 -40%,140% -40%,100% 100%,-40% 100%)}}
@keyframes rvCircle{from{clip-path:circle(0 at 50% 110%)}to{clip-path:circle(150vmax at 50% 110%)}}
.panel.rv .p-wrap > .back,.panel.rv .p-head{animation:fadeUp .45s .35s both}
@keyframes fadeUp{from{opacity:0;translate:0 18px}}
@keyframes fadeIn{from{opacity:0}}

/* ───────── scene: profile (arm hands over an ID card) ───────── */
.panel.pf-pre,.panel.pf-zoom{background:transparent;overflow:hidden}
.panel.pf-pre::before{clip-path:circle(0px at var(--ox,50%) var(--oy,50%))}
.panel.pf-zoom::before{clip-path:circle(150vmax at var(--ox,50%) var(--oy,50%));transition:clip-path .95s cubic-bezier(.6,0,.2,1) .62s}
.pf-pre .p-wrap,.pf-zoom .p-wrap{visibility:hidden}
.pf-in .p-wrap > .back,.pf-in .p-head,.pf-in .idc-hint,.pf-in .p-body > :not(.idc-slot),.pf-in .p-foot{animation:fadeUp .5s both}
.pf-in .p-head{animation-delay:.05s}.pf-in .idc-hint{animation-delay:.15s}.pf-in .p-body > :nth-child(3){animation-delay:.22s}.pf-in .p-body > :nth-child(4){animation-delay:.3s}
.pf-dim{position:fixed;inset:0;z-index:55;background:radial-gradient(circle,rgba(13,12,16,.5) 1.4px,transparent 1.9px) 0 0/7px 7px,rgba(13,12,16,.28);animation:fadeIn .3s both;transition:opacity .5s}
.pf-band{position:fixed;left:-10vw;right:-10vw;top:24vh;height:52vh;z-index:56;background:var(--ink);clip-path:polygon(0 22%,100% 0,100% 78%,0 100%);animation:bandIn .5s cubic-bezier(.2,.9,.2,1) both;transition:opacity .4s}
.pf-band::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--pop) 1.6px,transparent 2.2px) 0 0/11px 11px;opacity:.5;-webkit-mask:linear-gradient(100deg,transparent 35%,#000 90%);mask:linear-gradient(100deg,transparent 35%,#000 90%)}
@keyframes bandIn{from{clip-path:polygon(0 22%,0 22%,0 100%,0 100%)}}
.pf-arm{position:fixed;z-index:57;pointer-events:none;overflow:visible}
.pf-arm.front{z-index:59}
.pf-arm .pose-b{display:none}
.pf-arm.palm .pose-a{display:none}
.pf-arm.palm .pose-b{display:inline}
.pf-move{animation:pfIn .85s cubic-bezier(.2,.9,.25,1.1) both,pfBob 2.4s ease-in-out .85s infinite}
@keyframes pfIn{from{translate:75vw 8vh}}
@keyframes pfBob{50%{translate:0 -10px}}
.pf-cta{position:fixed;z-index:60;display:flex;align-items:center;gap:12px;font:400 clamp(30px,4vw,54px)/1 var(--f-display);color:var(--paper);transform:rotate(-6deg) skewX(-8deg);text-shadow:4px 4px 0 var(--pop);animation:fadeUp .4s .7s both;pointer-events:none;white-space:nowrap}
.pf-cta kbd{font-size:16px;text-shadow:none}
.pf-cta i{display:inline-block;width:.5em;height:.5em;background:var(--pop);clip-path:polygon(0 0,100% 50%,0 100%);animation:nudge .7s ease-in-out infinite alternate}
@keyframes nudge{to{translate:.18em 0}}

/* the ID card itself (same markup for the card in the hand and the full-size card) */
.idc-slot{perspective:1800px}
.idc{position:relative;width:min(760px,100%);aspect-ratio:1.586;container-type:inline-size;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.5,1);cursor:pointer;outline:none}
.idc.flipped{transform:rotateY(180deg)}
.idc:focus-visible .idc-face{outline:4px dashed var(--ink);outline-offset:6px}
.idc-fly{position:fixed;left:0;top:0;z-index:58;transform-origin:50% 50%;transition:none;margin:0}
.idc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2.8cqw;border:max(3px,.5cqw) solid var(--ink);overflow:hidden;color:var(--ink);box-shadow:1.4cqw 1.4cqw 0 var(--ink)}
.idc-front{display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:radial-gradient(circle at 88% 22%,transparent 0 6cqw,rgba(255,62,138,.0) 6cqw),repeating-radial-gradient(circle at 88% 22%,transparent 0 1.2cqw,rgba(255,62,138,.14) 1.2cqw 1.35cqw),repeating-linear-gradient(115deg,transparent 0 2cqw,rgba(255,225,74,.18) 2cqw 2.2cqw),var(--paper)}
.idc-top{display:flex;justify-content:space-between;align-items:center;gap:2cqw;background:var(--ink);color:var(--paper);padding:1.6cqw 2.6cqw;font:800 2cqw/1 var(--f-ui);letter-spacing:.18em;text-transform:uppercase}
.idc-top b{color:var(--pop);font-weight:800}
.idc-body{display:grid;grid-template-columns:30% minmax(0,1fr);gap:2.6cqw;padding:2.4cqw 2.8cqw 0;min-height:0}
.idc-photo{position:relative;align-self:start;aspect-ratio:.8;background:var(--bg);border:max(2px,.4cqw) solid var(--ink);border-radius:1.4cqw;overflow:hidden}
.idc-photo::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--deep) .25cqw,transparent .32cqw) 0 0/1.2cqw 1.2cqw;opacity:.35}
.idc-photo img{position:absolute;left:52%;bottom:-6%;width:128%;max-width:none;transform:translateX(-50%)}
.idc-fields{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.3cqw 2.2cqw;align-content:start}
.idc-fields dt{font:800 1.7cqw/1.9 var(--f-ui);letter-spacing:.18em;color:var(--deep);text-transform:uppercase;white-space:nowrap}
.idc-fields dd{margin:0;font:600 2.45cqw/1.3 var(--f-body);min-width:0}
.idc-fields dd.idc-name{font:400 4.8cqw/1 var(--f-display);letter-spacing:.01em}
.idc-fields .pill{font-size:1.6cqw;padding:.6cqw 1cqw .5cqw}
.idc-foot{display:flex;justify-content:space-between;align-items:flex-end;padding:1cqw 2.8cqw 2cqw}
.idc-sig{font:600 4.4cqw/1 var(--f-hand);transform:rotate(-4deg);border-bottom:.3cqw solid var(--ink);padding:0 1cqw .4cqw}
.idc-holo{width:8cqw;height:6cqw;border-radius:1cqw;border:.3cqw solid var(--ink);background:conic-gradient(from var(--hx),#ff3e8a,#ffd21a,#5fdc34,#1fb6ff,#9b5cff,#ff3e8a);animation:holo 4s linear infinite}
@keyframes holo{to{--hx:360deg}}
.idc-back{transform:rotateY(180deg);background:repeating-linear-gradient(-58deg,var(--paper) 0 2cqw,#f2efe6 2cqw 4cqw);display:flex;flex-direction:column}
.idc-stripe{height:17%;margin-top:7%;background:var(--ink)}
.idc-sigbox{display:flex;align-items:center;gap:2cqw;margin:5% 6% 0}
.idc-sigbox span{font:800 1.6cqw/1 var(--f-ui);letter-spacing:.18em}
.idc-sigbox b{flex:1;font:600 4.4cqw/1.5 var(--f-hand);padding:0 2cqw;background:repeating-linear-gradient(90deg,#fff 0 1cqw,#ffe9a0 1cqw 2cqw);border:.3cqw solid var(--ink)}
.idc-bar{height:13%;margin:5% 6% 0;width:40%;background:repeating-linear-gradient(90deg,var(--ink) 0 .45cqw,transparent .45cqw .8cqw,var(--ink) .8cqw 1.6cqw,transparent 1.6cqw 2cqw,var(--ink) 2cqw 2.3cqw,transparent 2.3cqw 2.9cqw)}
.idc-fine{margin:4% 6% 0;max-width:56%;font:500 1.75cqw/1.45 var(--f-body)}
.idc-stamp{position:absolute;right:5%;bottom:8%;width:24cqw;height:24cqw;transform:rotate(-14deg);color:var(--deep);opacity:.85}
.idc-hint{margin:16px 0 0;font:600 22px/1.2 var(--f-hand);color:var(--ink)}

/* ───────── scene: education (a notebook opens) ───────── */
.bk-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.book{--pw:min(540px,calc((100vw - 64px) / 2));position:relative;display:grid;grid-template-columns:1fr 1fr;width:calc(var(--pw) * 2);perspective:2800px;transform:translateX(-25%);transition:transform 1.05s cubic-bezier(.6,0,.25,1)}
.book.open{transform:none}
.book > *{grid-row:1;grid-column:2;min-width:0}
.book.drop{animation:bkDrop .75s cubic-bezier(.3,1.35,.5,1) .25s both}
@keyframes bkDrop{from{translate:0 -110vh;rotate:-16deg}}
.bk-cover,.bk-leaf{position:relative;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.6,0,.25,1)}
.bk-cover{z-index:3}
.bk-leaf{z-index:2}
.book.open .bk-cover{transform:rotateY(-180deg)}
.book.turned .bk-leaf{transform:rotateY(-180deg)}
.bk-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk-front{position:absolute;inset:0}
.bk-in,.bk-l-back{transform:rotateY(180deg)}
.bk-in{height:100%}
.bk-l-back{position:absolute;inset:0}
.book.no-tr,.book.no-tr *{transition:none!important;animation:none!important}
.book.narrow{width:100%;grid-template-columns:1fr;transform:none}
.book.narrow > *{grid-column:1}
.book.narrow.open .bk-cover{visibility:hidden;transition:transform 1.05s cubic-bezier(.6,0,.25,1),visibility 0s 1.05s}

.cv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:16px;padding:30px 28px 28px 60px;border:4px solid var(--ink);border-radius:6px 20px 20px 6px;background:var(--deep);color:var(--paper);overflow:hidden;
  box-shadow:5px 4px 0 -1px var(--page),5px 4px 0 2px var(--ink),10px 8px 0 -1px var(--page),10px 8px 0 2px var(--ink),18px 16px 0 2px var(--ink)}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:34px;background:var(--ink);box-shadow:inset -6px 0 0 rgba(255,255,255,.12)}
.cv::after{content:"";position:absolute;right:-12%;top:-10%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--bg) 2px,transparent 2.6px) 0 0/11px 11px;opacity:.55}
.cv > *{position:relative;z-index:1}
.cv-top{display:flex;justify-content:space-between;gap:12px;font:800 15px/1 var(--f-ui);letter-spacing:.2em}
.cv-title{font:400 clamp(56px,8vw,104px)/.85 var(--f-display);transform:rotate(-6deg) skewX(-6deg);text-shadow:5px 5px 0 var(--pop),9px 9px 0 var(--ink)}
.cv-label{align-self:flex-start;background:var(--page);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:12px 16px;min-width:min(300px,100%);font:600 15px/1 var(--f-body);display:grid;gap:9px;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--ink)}
.cv-label div{display:flex;gap:10px;align-items:baseline;border-bottom:2px dotted var(--ink);padding-bottom:5px}
.cv-label small{font:800 11px/1 var(--f-ui);letter-spacing:.14em;flex:none}
.cv-label b{font:600 22px/1 var(--f-hand)}
.cv-star{position:absolute;right:26px;bottom:24px;width:120px;height:120px;color:var(--pop);transform:rotate(12deg)}

.pg{position:relative;box-sizing:border-box;height:100%;min-height:min(600px,74vh);padding:34px 32px 56px 64px;color:var(--ink);border:4px solid var(--ink);
  background:linear-gradient(90deg,transparent 44px,var(--pop) 44px 46px,transparent 46px),repeating-linear-gradient(transparent 0 31px,rgba(10,92,156,.22) 31px 32px) 0 22px,var(--page)}
.pg::after{content:attr(data-n);position:absolute;left:0;right:0;bottom:16px;text-align:center;font:600 24px/1 var(--f-hand)}
.pg-l{border-radius:16px 0 0 16px;border-right-width:2px;box-shadow:inset -46px 0 46px -34px rgba(13,12,16,.4),-8px 10px 0 var(--ink)}
.pg-r{border-radius:0 16px 16px 0;border-left-width:2px;box-shadow:inset 46px 0 46px -34px rgba(13,12,16,.4),10px 10px 0 var(--ink)}
.narrow .pg{border-radius:6px 16px 16px 6px;border-width:4px;box-shadow:inset 30px 0 30px -24px rgba(13,12,16,.3),8px 8px 0 var(--ink)}
.pg-tab{display:inline-block;font:800 13px/1 var(--f-ui);letter-spacing:.2em;background:var(--ink);color:var(--paper);padding:6px 10px 5px;transform:skewX(-10deg);margin-bottom:16px}
.pg-h{margin:0;font:400 clamp(28px,3.4vw,40px)/1.02 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.pg-sub{margin:8px 0 18px;font:600 17px/1.45 var(--f-body);max-width:40ch}
.pg-dates{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;font:800 clamp(20px,2.4vw,27px)/1 var(--f-ui);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pg-dates i{font-style:normal;color:var(--pop)}
.pg-dates small{font-size:.5em;letter-spacing:.14em}
.prog{margin-top:22px}
.prog-bar{position:relative;height:22px;background:var(--paper);border:3px solid var(--ink);border-radius:4px}
.prog-bar > i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-45deg,var(--pop) 0 8px,var(--deep) 8px 11px);transition:width 1.4s cubic-bezier(.2,.9,.2,1)}
.filled .prog-bar > i{width:var(--p)}
.prog-bar > b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.prog-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:800 14px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.pg-note{display:inline-block;margin:14px 0 0;font:600 25px/1.1 var(--f-hand);color:var(--deep);transform:rotate(-3deg)}
.pg .chips{margin-top:20px}
.pg-doodle{position:absolute;right:24px;top:30px;font:600 23px/1.2 var(--f-hand);color:var(--deep);opacity:.55;transform:rotate(-7deg);white-space:pre;text-align:right;pointer-events:none}
.cts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ct{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 16px;align-items:center;padding-bottom:12px;border-bottom:2px dashed rgba(13,12,16,.3)}
.ct-stamp{grid-row:span 2;display:grid;place-items:center;width:72px;aspect-ratio:1;border:3px solid var(--pop);border-radius:50%;color:var(--pop);font:400 21px/.9 var(--f-display);text-align:center;transform:rotate(-12deg);font-variant-numeric:tabular-nums}
.ct-stamp small{display:block;font:800 11px/1 var(--f-ui);letter-spacing:.14em}
.ct:nth-child(even) .ct-stamp{transform:rotate(9deg)}
.ct-name{font:700 19px/1.2 var(--f-ui);letter-spacing:.02em}
.ct-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.ct-org{font:500 14px/1.3 var(--f-body)}
.bk-nav{display:flex;align-items:center;gap:12px}
.bk-nav button{border:0;cursor:pointer;background:var(--ink);color:var(--paper);font:800 14px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:10px 13px 9px;transform:skewX(-10deg)}
.bk-nav button:disabled{opacity:.35;cursor:default}
.bk-nav span{font:800 15px/1 var(--f-ui);letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.bk-nav button{white-space:nowrap}
.bk-nav button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

/* ───────── scene: projects (wheel around the head) ───────── */
.pj{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:center;gap:12px 24px}
.pj-stage{position:relative;width:100%;aspect-ratio:1/.86;min-width:0;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.pj-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pj-ring{z-index:1}
.pj-ring .band-u{fill:none;stroke:var(--paper);stroke-linecap:round}
.pj-ring .band{fill:none;stroke:var(--ink);stroke-linecap:round}
.pj-ring .band-in{fill:none;stroke:var(--pop);stroke-linecap:round;stroke-dasharray:2 14}
#pj-ticks{transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.pj-head{position:absolute;z-index:0;max-width:none;pointer-events:none;filter:drop-shadow(12px 6px 0 var(--pop)) drop-shadow(-5px 0 0 var(--ink))}
.pj-node{--a:180deg;--s:58px;position:absolute;z-index:2;left:var(--cx);top:var(--cy);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);padding:0;border:0;background:none;cursor:pointer;
  transform:rotate(var(--a)) translateX(var(--R)) rotate(calc(-1 * var(--a)));transition:--a .55s cubic-bezier(.3,1.25,.5,1),opacity .3s,width .3s,height .3s,margin .3s}
.pj-node.jump{transition:opacity .3s}
.pj-node.far{opacity:0;pointer-events:none}
.pj-node .dia{position:absolute;inset:0;background:var(--paper);border:4px solid var(--ink);transform:rotate(45deg);box-shadow:5px 5px 0 var(--ink);transition:background .2s}
.pj-node svg{position:relative;width:56%;height:56%;margin:22%;color:var(--ink)}
.pj-node.on{--s:86px;z-index:3}
.pj-node.on .dia{background:var(--pop)}
.pj-node:not(.on):hover .dia{background:var(--ray)}
.pj-node:focus-visible{outline:3px dashed var(--ink);outline-offset:10px}
.pj-lbl{position:absolute;right:calc(100% + 30px);top:50%;width:max-content;max-width:230px;transform:translateY(-50%) skewX(-8deg);text-align:right;font:400 21px/1.05 var(--f-display);color:var(--ink);letter-spacing:.01em;pointer-events:none;transition:font-size .3s,color .3s,background .3s,padding .3s}
.pj-node.on .pj-lbl{font-size:30px;max-width:260px;color:var(--paper);background:var(--ink);padding:6px 14px 4px;box-shadow:5px 5px 0 var(--pop)}
.pj-arr{position:absolute;z-index:3;width:54px;height:54px;margin:-27px 0 0 -27px;padding:0;border:0;cursor:pointer;background:none;transition:transform .15s;
  filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(4px 4px 0 var(--ink))}
.pj-arr .tri{position:absolute;inset:4px;background:var(--pop);clip-path:polygon(50% 0,100% 90%,0 90%);transition:background .15s}
.pj-arr.down .tri{clip-path:polygon(0 10%,100% 10%,50% 100%)}
.pj-arr:hover .tri{background:var(--paper)}
.pj-arr:active{transform:scale(.88)}
.pj-arr:focus-visible{outline:3px dashed var(--ink);outline-offset:6px;border-radius:50%}
.pj-info{min-width:0}
.pj-card{position:relative;background:var(--paper);color:var(--ink);padding:24px 26px 24px;clip-path:polygon(0 2%,100% 0,98% 100%,2% 97%);display:flex;flex-direction:column;gap:12px;animation:pjCard .38s cubic-bezier(.2,.9,.2,1) both}
.pj-card.up{animation-name:pjCardUp}
@keyframes pjCard{from{opacity:0;translate:0 26px;rotate:2deg}}
@keyframes pjCardUp{from{opacity:0;translate:0 -26px;rotate:-2deg}}
.pj-infow{filter:drop-shadow(9px 9px 0 var(--ink))}
.pj-count{position:absolute;right:20px;top:16px;font:400 34px/1 var(--f-display);color:var(--pop);-webkit-text-stroke:2px var(--ink);font-variant-numeric:tabular-nums}
.pj-name{margin:0;font:400 clamp(32px,3.6vw,50px)/.95 var(--f-display);letter-spacing:.01em;padding-right:70px;text-wrap:balance}
.pj-desc{margin:0;font:500 16px/1.55 var(--f-body)}
.pj-card .lnk{align-self:flex-start}
.pj-help{margin:12px 4px 0;font:600 21px/1.2 var(--f-hand);color:var(--ink)}
.pj.intro .pj-head{animation:pjHead .75s cubic-bezier(.2,.9,.2,1) .2s both}
@keyframes pjHead{from{translate:-70vw 0;rotate:-10deg}}
.pj.intro .band,.pj.intro .band-u{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s cubic-bezier(.6,0,.3,1) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pj.intro .pj-node{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.9s + var(--k) * .09s)}
@keyframes pop{from{scale:0}}
.pj.intro .pj-arr{animation:fadeIn .3s 1.2s both}
.pj.intro .pj-infow{animation:pjInfo .6s cubic-bezier(.2,.9,.2,1) .7s both}
@keyframes pjInfo{from{translate:60vw 0;rotate:6deg}}

/* ───────── scene: contact (rotary phone) ───────── */
.ph{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px 34px;align-items:center}
.ph-stage{position:relative;width:100%;max-width:560px;justify-self:center}
.ph-svg{display:block;width:100%;height:auto;overflow:visible}
.ph-svg text{font-family:var(--f-display);user-select:none;-webkit-user-select:none}
.ph-hole{fill:transparent;cursor:grab;touch-action:none}
.ph-hole:active{cursor:grabbing}
.ph-hole:hover + .ph-hl,.ph-hole.hint + .ph-hl{opacity:1}
.ph-hl{fill:none;stroke:var(--pop);stroke-width:6;opacity:0;pointer-events:none;transition:opacity .15s}
#ph-hs{transform-box:fill-box;transform-origin:50% 100%}
.ph.ring #ph-hs{animation:ringing .08s linear 12 alternate}
@keyframes ringing{from{transform:rotate(-4deg) translateY(-8px)}to{transform:rotate(4deg) translateY(-14px)}}
.ph-zirr{position:absolute;left:2%;top:-2%;font:400 clamp(34px,5vw,62px)/1 var(--f-display);color:var(--pop);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:rotate(-12deg);opacity:0;pointer-events:none}
.ph.ring .ph-zirr{animation:zirr .95s steps(1) both}
.ph-zirr.r2{left:auto;right:0;top:4%;transform:rotate(10deg)}
@keyframes zirr{0%{opacity:1;scale:1}25%{scale:1.15}50%{scale:1}75%{scale:1.15}100%{opacity:0}}
.ph.intro .ph-stage{animation:phUp .8s cubic-bezier(.2,1.25,.4,1) .15s both}
@keyframes phUp{from{translate:0 80vh;rotate:8deg}}
.ph.intro .ph-side{animation:pjInfo .6s cubic-bezier(.2,.9,.2,1) .55s both}
.ph-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.ph-tkw{filter:drop-shadow(9px 9px 0 var(--ink))}
.ph-tk{position:relative;background:var(--paper);color:var(--ink);padding:20px 24px 22px;clip-path:polygon(0 0,100% 0,100% 40%,97% 46%,100% 52%,100% 100%,0 100%,0 52%,3% 46%,0 40%);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;min-height:170px}
.ph-dig{grid-row:span 3;position:relative;display:grid;place-items:center;width:88px;height:108px;background:var(--ink);color:var(--paper);border-radius:8px;font:400 76px/1 var(--f-display);font-variant-numeric:tabular-nums;overflow:hidden}
.ph-dig::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--bg)}
.ph-dig.flip{animation:flip .22s ease-out}
@keyframes flip{from{transform:rotateX(70deg);filter:brightness(1.8)}}
.ph-line{font:800 13px/1 var(--f-ui);letter-spacing:.2em;color:var(--deep);text-transform:uppercase}
.ph-label{font:400 clamp(30px,3.4vw,44px)/1 var(--f-display);letter-spacing:.01em;overflow-wrap:anywhere}
.ph-handle{font:600 16px/1.35 var(--f-body);overflow-wrap:anywhere}
.ph-tk .lnk{grid-column:1/-1;justify-self:start;margin-top:10px}
.ph-tk .lnk.wait{visibility:hidden}
.ph-dir{background:var(--page);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:12px 16px 14px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(74,26,160,.2) 33px 34px);background-position:0 40px}
.ph-dir h3{margin:0 0 6px;font:800 14px/1 var(--f-ui);letter-spacing:.2em}
.ph-dir ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.ph-dir button{width:100%;display:flex;align-items:baseline;gap:10px;border:0;background:none;cursor:pointer;padding:6px 2px 5px;text-align:left;font:600 18px/1.2 var(--f-body);color:var(--ink)}
.ph-dir button b{font:400 22px/1 var(--f-display);min-width:1ch}
.ph-dir button:hover{background:var(--pop)}
.ph-dir button:focus-visible{outline:3px dashed var(--ink);outline-offset:1px}
.ph-help{margin:0;font:600 21px/1.2 var(--f-hand);color:var(--ink)}

/* skills */
.sk-group + .sk-group{margin-top:8px}
.tile{filter:drop-shadow(6px 6px 0 var(--ink))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.tile{position:relative;background:var(--paper);color:var(--ink);padding:16px 16px 15px;clip-path:polygon(0 0,100% 3%,98% 100%,2% 97%);display:flex;flex-direction:column;gap:8px;min-width:0}

.tile-e{font:500 14px/1.45 var(--f-body)}
.tile::after{content:"";position:absolute;right:10px;top:10px;width:14px;height:14px;background:var(--bg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* wipe transition */
.wipe{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.wipe i{position:absolute;top:-20%;bottom:-20%;left:0;width:150%;transform:translateX(-160%) skewX(-18deg)}
.wipe i:nth-child(1){background:var(--accent)}
.wipe i:nth-child(2){background:var(--paper)}
.wipe i:nth-child(3){background:var(--ink)}

/* ═════════════════════════ engine ═════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { lang: "tr", sel: 0, open: null, tip: 0, catClicks: 0, artLayer: 0, artKey: null, busy: false, pj: 0, sceneKey: null, cleanup: [] };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[S.lang] ?? v.tr) : v;
const ui = () => UI[S.lang];
const up = s => s.toLocaleUpperCase(S.lang === "tr" ? "tr-TR" : "en-US");
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const wait = ms => new Promise(r => setTimeout(r, ms));
const isNarrow = () => innerWidth < 760;

const ym = s => { const [y, m] = s.split("-").map(Number); return new Date(y, m - 1, 1) };
const MONTHS = { tr: ["OCA","ŞUB","MAR","NİS","MAY","HAZ","TEM","AĞU","EYL","EKİ","KAS","ARA"], en: ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"] };
const mon = d => MONTHS[S.lang][d.getMonth()];
const fmtDay = s => { const d = new Date(s + "T12:00:00"); return S.lang === "tr" ? d.toLocaleDateString("tr-TR") : d.toLocaleDateString("en-GB") };
function studyYear(dg) {
  const st = ym(dg.start), en = ym(dg.end), now = new Date();
  const total = (en - st), el = Math.min(Math.max(now - st, 0), total);
  const years = Math.round(total / 31557600000);
  const year = Math.min(years, Math.floor(el / 31557600000) + 1);
  return { pct: total ? el / total : 0, year, years, done: now >= en };
}

/* ransom-note name: deterministic letter styles */
const LSTYLE = [
  ["var(--f-display)", "var(--paper)", "var(--ink)", "-6deg", "0px", "1.08em"],
  ["var(--f-heavy)", "var(--ink)", "var(--paper)", "4deg", "-3px", ".92em"],
  ["var(--f-serif)", "var(--accent)", "var(--on-accent)", "-2deg", "2px", "1em"],
  ["var(--f-display)", "var(--ink)", "var(--paper)", "7deg", "-1px", "1.14em"],
  ["var(--f-heavy)", "var(--paper)", "var(--ink)", "-4deg", "3px", ".88em"],
  ["var(--f-serif)", "var(--paper)", "var(--ink)", "3deg", "-2px", "1.02em"]
];
function ransom(el, text, offset = 0) {
  el.setAttribute("aria-label", text);
  let i = offset;
  el.innerHTML = text.split(" ").map(w => `<span class="w" aria-hidden="true">${[...up(w)].map(ch => {
    const [f, b, c, r, y, s] = LSTYLE[(i++ * 5 + 1) % LSTYLE.length];
    return `<span class="l" style="--f:${f};--b:${b};--c:${c};--r:${r};--y:${y};--s:${s}">${esc(ch)}</span>`;
  }).join("")}</span>`).join("");
}

/* date HUD */
function tickDate() {
  const d = new Date(), h = d.getHours(), dd = String(d.getDate()).padStart(2, "0"), mm = String(d.getMonth() + 1).padStart(2, "0");
  $("#date-dm").textContent = S.lang === "tr" ? `${dd}/${mm}` : `${mm}/${dd}`;
  $("#date-dw").textContent = ui().days[d.getDay()];
  $("#date-tod").textContent = ui().tod[h < 5 ? 0 : h < 11 ? 1 : h < 17 ? 2 : h < 21 ? 3 : 0];
}

/* character art */
const preload = [...Object.values(ART).map(a => a.src), PJ_HEAD.src, "img/cat_box.png"].map(src => { const i = new Image(); i.src = src; return i });
function setArt(key) {
  if (S.artKey === key) return;
  S.artKey = key;
  const a = ART[key], fig = $("#char");
  const imgs = [$("#art-a"), $("#art-b")];
  const next = imgs[S.artLayer ^= 1], prev = imgs[S.artLayer ^ 1];
  fig.style.setProperty("--h", a.h);
  next.src = a.src;
  prev.classList.remove("on");
  next.classList.remove("on"); void next.offsetWidth; next.classList.add("on");
  if (!reduce) { fig.classList.add("flash"); setTimeout(() => fig.classList.remove("flash"), 70); }
}

/* menu */
function renderMenu() {
  const m = $("#menu");
  m.setAttribute("aria-label", ui().menuLabel);
  m.innerHTML = SECTIONS.map((s, i) => `<button type="button" class="mi${i === S.sel ? " on" : ""}" style="--i:${i}" data-i="${i}" data-id="${s.id}"><span class="t">${esc(T(s.label))}</span></button>`).join("");
  m.querySelectorAll(".mi").forEach(b => {
    b.addEventListener("mouseenter", () => select(+b.dataset.i));
    b.addEventListener("focus", () => select(+b.dataset.i));
    b.addEventListener("click", () => go(b.dataset.id));
  });
}
function select(i, keepArt) {
  S.sel = (i + SECTIONS.length) % SECTIONS.length;
  document.querySelectorAll(".mi").forEach((b, j) => b.classList.toggle("on", j === S.sel));
  $("#hint").textContent = T(SECTIONS[S.sel].hint);
  $("#app").dataset.sec = SECTIONS[S.sel].id;
  if (!keepArt) setArt(SECTIONS[S.sel].art);
}

/* cat */
function sayTip(next) {
  if (next) S.tip = (S.tip + 1) % ui().tips.length;
  $("#bubble").innerHTML = `<b>${esc(T(PORTFOLIO.cat.name))} · ${esc(ui().catTag)}</b>${esc(ui().tips[S.tip])}`;
}
$("#navi").addEventListener("click", () => {
  const n = $("#navi");
  n.classList.remove("wiggle"); void n.offsetWidth; n.classList.add("wiggle");
  S.catClicks++;
  if (S.catClicks % 5 === 0) {
    $("#bubble").innerHTML = `<b>${esc(T(PORTFOLIO.cat.name))} · ${esc(ui().catTag)}</b>${esc(ui().egg)}<img src="img/kitten.png" alt="">`;
  } else sayTip(true);
  n.classList.add("talk");
  clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove("talk"), 6000);
});

    const angOf = (e, c) => Math.atan2(e.clientX - c.x, -(e.clientY - c.y)) * 180 / Math.PI;
    svg.addEventListener("pointerdown", e => {
      const h = e.target.closest(".ph-hole"); if (!h || busy) return;
      e.preventDefault(); busy = true;
      const c = centre(); drag = { d: +h.dataset.d, c, last: angOf(e, c), acc: 0, moved: false };
      try { svg.setPointerCapture(e.pointerId) } catch (er) {}
    });
    svg.addEventListener("pointermove", e => {
      if (!drag) return;
      const a = angOf(e, drag.c); let da = a - drag.last; if (da > 180) da -= 360; if (da < -180) da += 360;
      drag.last = a; drag.acc += da; if (Math.abs(drag.acc) > 5) drag.moved = true;
      setR(Math.max(0, Math.min(rotFor(drag.d), drag.acc)));
    });
    const end = () => {
      if (!drag) return; const { d, moved } = drag; drag = null;
      if (!moved) { busy = false; dial(d); return }
      if (r >= rotFor(d) - 12) { setR(rotFor(d)); commit(d) }
      goHome();
    };
    svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
    $$(".ph-dir button", p).forEach(b => b.addEventListener("click", () => dial(+b.dataset.d)));
    S.sceneKey = e => { if (/^[0-9]$/.test(e.key)) { dial(e.key === "0" ? 10 : +e.key); return true } return false };
    ticket(null);
    if (!instant) {
      ph.classList.add("intro"); p.classList.add("rv"); p.style.setProperty("--rv", "rvCircle");
      setTimeout(() => p.classList.remove("rv"), 700);
      setTimeout(() => ph.classList.add("ring"), 950);
      setTimeout(() => { ph.classList.remove("ring", "intro"); const h = $('.ph-hole[data-d="1"]', p); h && h.classList.add("hint") }, 2000);
    }
  }
};

/* ═════════════════════════ panels + routing ═════════════════════════ */
const INTRO = new Set(["profil", "egitim", "projeler", "iletisim"]);
function clearScene() { S.cleanup.forEach(f => f()); S.cleanup = []; S.sceneKey = null }
function showPanel(id, instant) {
  clearScene();
  const p = $("#panel");
  p.className = "panel sc-" + id; p.removeAttribute("style");
  p.innerHTML = panelHTML(id);
  p.hidden = false; p.scrollTop = 0;
  $("#back", p).addEventListener("click", () => close());
  S.open = id; S.narrowAtOpen = isNarrow();
  $("#stage").setAttribute("aria-hidden", "true");
  SCENES[id]?.(p, instant || reduce);
  if (!(id === "profil" && !instant && !reduce)) requestAnimationFrame(() => $("#back", p)?.focus({ preventScroll: true }));
}
function hidePanel() {
  clearScene();
  const p = $("#panel"), was = S.open;
  p.hidden = true; p.innerHTML = ""; p.className = "panel"; p.removeAttribute("style"); S.open = null;
  $("#stage").removeAttribute("aria-hidden");
  const i = SECTIONS.findIndex(s => s.id === was);
  if (i >= 0) { select(i); document.querySelectorAll(".mi")[i]?.focus({ preventScroll: true }); }
}
addEventListener("resize", () => { if (S.open === "egitim" && isNarrow() !== S.narrowAtOpen) showPanel("egitim", true) });

/* diagonal wipe: runs fn at full cover */
function wipe(fn) {
  if (reduce || !document.body.animate) { fn(); return Promise.resolve(); }
  S.busy = true;
  const bars = [...$("#wipe").children];
  const dur = 520;
  const anims = bars.map((b, k) => b.animate([
    { transform: "translateX(-160%) skewX(-18deg)" },
    { transform: "translateX(-14%) skewX(-18deg)", offset: .5 },
    { transform: "translateX(160%) skewX(-18deg)" }
  ], { duration: dur, delay: k * 50, easing: "cubic-bezier(.7,0,.3,1)" }));
  setTimeout(fn, dur * .5 + 100);
  return anims[anims.length - 1].finished.then(() => { S.busy = false });
}

function go(id) { if (location.hash.slice(1) === id) route(); else location.hash = id; }
function close() { if (location.hash) location.hash = ""; else route(); }
function route(first) {
  const id = decodeURIComponent(location.hash.slice(1));
  const valid = SECTIONS.some(s => s.id === id);
  if (valid && S.open !== id) {
    const i = SECTIONS.findIndex(s => s.id === id); select(i);
    if (first || reduce) showPanel(id, true);
    else if (!S.open && INTRO.has(id)) showPanel(id, false);
    else wipe(() => showPanel(id, true));
  } else if (!valid && S.open) {
    wipe(hidePanel);
  }
}
addEventListener("hashchange", () => route(false));

/* keyboard */
addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (S.open) {
    if (e.key === "Escape" || e.key === "Backspace" && e.target === document.body) { e.preventDefault(); close(); return; }
    if (S.sceneKey && !(e.key === "Enter" && e.target.closest("a,button:not(.idc-fly)")) && S.sceneKey(e)) e.preventDefault();
    return;
  }
  if (["ArrowDown", "s", "S"].includes(e.key)) { e.preventDefault(); select(S.sel + 1); document.querySelectorAll(".mi")[S.sel].focus({ preventScroll: true }); }
  else if (["ArrowUp", "w", "W"].includes(e.key)) { e.preventDefault(); select(S.sel - 1); document.querySelectorAll(".mi")[S.sel].focus({ preventScroll: true }); }
  else if (e.key === "Enter" && !e.target.closest("button,a")) { go(SECTIONS[S.sel].id); }
});

/* language */
function applyLang() {
  const u = ui();
  $("#app").setAttribute("lang", S.lang);
  $("#lang-tr").setAttribute("aria-pressed", S.lang === "tr");
  $("#lang-en").setAttribute("aria-pressed", S.lang === "en");
  ransom($("#ransom"), PORTFOLIO.name);
  $("#role span").textContent = T(PORTFOLIO.role);
  $("#hb-tag").textContent = u.menu;
  $("#hb-keys").innerHTML = `<kbd>↑</kbd><kbd>↓</kbd> ${u.select} <kbd>Enter</kbd> ${u.open} <kbd>Esc</kbd> ${u.back}`;
  $("#navi").setAttribute("aria-label", u.catLabel);
  $("#cat-name").textContent = T(PORTFOLIO.cat.name);
  renderMenu(); select(S.sel, true); tickDate(); sayTip(false);
  if (S.open) showPanel(S.open, true);
}
$("#lang-tr").addEventListener("click", () => { S.lang = "tr"; store.set("br-lang", "tr"); applyLang(); });
$("#lang-en").addEventListener("click", () => { S.lang = "en"; store.set("br-lang", "en"); applyLang(); });

/* boot */
S.lang = store.get("br-lang") === "en" ? "en" : "tr";
applyLang();
setArt("hero"); /* idle pose on first view; moving through the menu swaps it */
setInterval(tickDate, 60000);
route(true);
</script>
